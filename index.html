    function normalizePositionNumber(position) {
        const value = String(position || '').trim().toUpperCase().replaceAll(' ', '');
        const aliases = {
            'P': 1, '投': 1, '投手': 1, '1': 1,
            'C': 2, '捕': 2, '捕手': 2, '2': 2,
            '1B': 3, '一垒': 3, '一垒手': 3, '3': 3,
            '2B': 4, '二垒': 4, '二垒手': 4, '4': 4,
            '3B': 5, '三垒': 5, '三垒手': 5, '5': 5,
            'SS': 6, '游击': 6, '游击手': 6, '6': 6,
            'LF': 7, '左外': 7, '左外野': 7, '7': 7,
            'CF': 8, '中外': 8, '中外野': 8, '8': 8,
            'RF': 9, '右外': 9, '右外野': 9, '9': 9,
            '自由人': 10, '自由': 10, 'SF': 10, 'FLEX': 10, '10': 10
        };
        return aliases[value] || 0;
    }

    function canonicalPosition(position) {
        const value = String(position || '').trim().toUpperCase().replaceAll(' ', '')
            .replaceAll('壘', '垒').replaceAll('遊', '游');
        const battingOnlyAliases = {
            'DH': 'DH', '指定打击': 'DH', '指定打者': 'DH', '指定打击员': 'DH',
            'EH': 'EH', '额外打击': 'EH', '额外打者': 'EH', '额外打击员': 'EH'
        };
        if (battingOnlyAliases[value]) return battingOnlyAliases[value];
        const number = normalizePositionNumber(value);
        return [...fieldPositions, flexPosition].find(item => item.number === number)?.short || value;
    }

    function canUsePosition(position) {
        if (position === 'DH' && gameConfig.key === 'slow') {
            alert('慢垒请使用 EH；DH 仅用于棒球和垒球。');
            return false;
        }
        if (position === 'EH' && gameConfig.key !== 'slow') {
            alert('EH 仅用于慢垒；棒球和垒球请使用 DH。');
            return false;
        }
        return true;
    }

    function isBattingOnlyPosition(position) {
        return ['DH', 'EH'].includes(canonicalPosition(position));
    }

    function getFielders(battingTeamIndex) {
        const defense = teams[battingTeamIndex === 0 ? 1 : 0];
        const positions = gameConfig.hasFlex ? [...fieldPositions, flexPosition] : fieldPositions;
        return positions.map(position => {
            const playerIndex = defense.lineup.findIndex(player =>
                player.active !== false && !player.removed && normalizePositionNumber(player.pos) === position.number
            );
            const player = defense.lineup[playerIndex] || { name: '未指定', pos: '' };
            return { ...position, playerIndex, player };
        });
    }

    function getDefenseTeamIndex(battingTeamIndex) {
        return battingTeamIndex === 0 ? 1 : 0;
    }

    function renderPositionSwapControls(teamIndex) {
        const firstSelect = document.getElementById('swap-player-a');
        const secondSelect = document.getElementById('swap-player-b');
        if (!firstSelect || !secondSelect) return;
        const defense = teams[getDefenseTeamIndex(detailTarget.teamIndex)];
        const previousFirst = firstSelect.value;
        const previousSecond = secondSelect.value;
        const activeEntries = getLineupEntries(defense, true)
            .filter(({ player }) => !isBattingOnlyPosition(player.pos));
        const options = activeEntries.map(({ player, playerIndex }) =>
            `<option value="${playerIndex}">${escapeHtml(player.pos || '未设置')} · ${escapeHtml(player.name)}</option>`
        ).join('');
        firstSelect.innerHTML = options;
        secondSelect.innerHTML = options;
        firstSelect.value = activeEntries.some(entry => String(entry.playerIndex) === previousFirst) ? previousFirst : String(activeEntries[0]?.playerIndex ?? '');
        secondSelect.value = activeEntries.some(entry => String(entry.playerIndex) === previousSecond) ? previousSecond : String(activeEntries[1]?.playerIndex ?? activeEntries[0]?.playerIndex ?? '');
    }

    function swapDetailPositions() {
        if (!detailTarget) return;
        const firstSelect = document.getElementById('swap-player-a');
        const secondSelect = document.getElementById('swap-player-b');
        const firstIndex = Number(firstSelect?.value);
        const secondIndex = Number(secondSelect?.value);
        const defense = teams[getDefenseTeamIndex(detailTarget.teamIndex)];
        if (!Number.isInteger(firstIndex) || !Number.isInteger(secondIndex) || firstIndex === secondIndex
            || !defense.lineup[firstIndex] || !defense.lineup[secondIndex]
            || isBattingOnlyPosition(defense.lineup[firstIndex].pos) || isBattingOnlyPosition(defense.lineup[secondIndex].pos)
            || defense.lineup[firstIndex].active === false || defense.lineup[secondIndex].active === false) return;
        const firstPosition = defense.lineup[firstIndex]?.pos || '';
        defense.lineup[firstIndex].pos = defense.lineup[secondIndex]?.pos || '';
        defense.lineup[secondIndex].pos = firstPosition;
        defense.defensiveAlignment = createAlignment(defense.lineup);
        renderAll();
        renderDetailEditor();
        saveToLocalStorage();
    }

    function getFielderLabel(battingTeamIndex, playerIndex) {
        const defense = teams[battingTeamIndex === 0 ? 1 : 0];
        const player = defense.lineup[playerIndex];
        if (!player) return '未知守备员';
        const position = player.pos ? `${player.pos} ` : '';
        return `${position}${player.name}`;
    }

    function cloneDetail(detail) {
        return JSON.parse(JSON.stringify(detail));
    }

    function openPlayDetail(teamIndex, playerIndex, inningIndex) {
        if (!canRecordCell(teamIndex, playerIndex, inningIndex)) return;
        const saved = teams[teamIndex].playDetails?.[playerIndex]?.[inningIndex];
        detailTarget = { teamIndex, playerIndex, inningIndex };
        detailDraft = cloneDetail(saved || createPlayDetail());
        const team = teams[teamIndex];
        const player = team.lineup[playerIndex];
        const result = team.gridData?.[playerIndex]?.[inningIndex]?.[0] || '尚未录入结果';
        const [baseResult = '', rbiText = '0'] = result === '尚未录入结果' ? [] : result.split('-');
        detailDraft.result = baseResult;
        detailDraft.rbi = Math.min(4, Math.max(0, Number.parseInt(rbiText, 10) || 0));
        applySuggestedBatterRecord(baseResult, false);
        document.getElementById('detail-title').textContent = saved ? '补充这球' : '本球详细记录';
        document.getElementById('detail-context').textContent = `${team.name} · 第 ${inningIndex + 1} 局 · ${player.name} · ${result}`;
        document.getElementById('detail-modal').classList.add('open');
        renderDetailEditor();
    }

    function closePlayDetail() {
        document.getElementById('detail-modal').classList.remove('open');
        detailDraft = null;
        detailTarget = null;
    }

    function renderDetailEditor() {
        if (!detailDraft || !detailTarget) return;
        const selectedResult = detailResultOptions.find(option => option.value === detailDraft.result);
        document.getElementById('detail-result-options').innerHTML = detailResultOptions.map(option => `
            <button type="button" class="choice-btn ${detailDraft.result === option.value ? 'selected' : ''}"
                onclick="setDetailResult('${option.value}')">${option.label}</button>
        `).join('');
        document.getElementById('detail-rbi-row').classList.toggle('visible', Boolean(selectedResult?.rbi));
        document.getElementById('detail-rbi').value = String(detailDraft.rbi || 0);

        document.getElementById('contact-type-options').innerHTML = contactTypes.map(type => `
            <button type="button" class="choice-btn ${detailDraft.contactType === type ? 'selected' : ''}" onclick="setContactType('${type}')">${type}</button>
        `).join('');

        const defenseTeamIndex = getDefenseTeamIndex(detailTarget.teamIndex);
        const defenseTeam = teams[defenseTeamIndex];
        document.getElementById('swap-team-label').textContent = `${defenseTeam.name} · 交换守备位置`;
        const fielders = getFielders(detailTarget.teamIndex);
        document.getElementById('defense-context').textContent = `防守方：${defenseTeam.name}。点击球场记录落点；按处理顺序点击守备员记录传球。`;
        const field = document.getElementById('field-recorder');
        field.innerHTML = fielders.map(fielder => `
            <button type="button" class="field-label ${detailDraft.throws.includes(fielder.playerIndex) ? 'selected' : ''}"
                style="left:${fielder.x}%; top:${fielder.y}%;"
                ${fielder.playerIndex < 0 ? 'disabled' : ''}
                onclick="event.stopPropagation(); addThrow(${fielder.playerIndex})">
                ${fielder.short}<br>${escapeHtml(fielder.player.name)}
            </button>
        `).join('') + (detailDraft.landing ? `
            <span class="landing-marker" style="left:${detailDraft.landing.x}%; top:${detailDraft.landing.y}%;" title="${escapeHtml(detailDraft.landingZone)}"></span>
        ` : '');

        const throwLabels = detailDraft.throws.map(index => getFielderLabel(detailTarget.teamIndex, index));
        document.getElementById('throw-chain').textContent = throwLabels.length
            ? `实际传球：${throwLabels.join(' → ')}`
            : '尚未记录传球；按实际处理顺序点击场上的守备员。';

        const errorSelect = document.getElementById('error-fielder');
        errorSelect.innerHTML = '<option value="">无 / 未指定</option>' + getFielders(detailTarget.teamIndex).filter(fielder => fielder.playerIndex >= 0).map(fielder => `
            <option value="${fielder.playerIndex}">${escapeHtml(getFielderLabel(detailTarget.teamIndex, fielder.playerIndex))}</option>
        `).join('');
        errorSelect.value = detailDraft.errorFielder;
        renderPositionSwapControls(detailTarget.teamIndex);

        renderRunnerOutcomes();
        document.getElementById('detail-balls').value = detailDraft.balls;
        document.getElementById('detail-strikes').value = detailDraft.strikes;
        document.getElementById('detail-outs').value = detailDraft.outs;
        document.getElementById('detail-pitches').value = detailDraft.pitches;
        document.getElementById('detail-minutes').value = detailDraft.minutesRemaining;
        document.getElementById('detail-note').value = detailDraft.note;
        renderDetailPreview();
    }

    function applySuggestedBatterRecord(result, overwrite = true) {
        if (!detailDraft || !result) return;
        const record = normalizeRunnerRecord(detailDraft.runners.batter);
        if (!overwrite && record.outcome) return;

        const suggestions = {
            '1B': { outcome: 'first', reason: 'battedBall' },
            '2B': { outcome: 'second', reason: 'battedBall' },
            '3B': { outcome: 'third', reason: 'battedBall' },
            'HR': { outcome: 'score', reason: 'battedBall' },
            'BB': { outcome: 'first', reason: 'walk' },
            'ROE': { outcome: 'first', reason: 'error' },
            'FC': { outcome: 'first', reason: 'battedBall' },
            'SO': { outcome: 'out', reason: '' },
            'DP': { outcome: 'out', reason: '' },
            'OUT': { outcome: 'out', reason: '' },
            'IFF': { outcome: 'out', reason: '' },
            'FO': { outcome: 'out', reason: '' },
            'SF': { outcome: 'out', reason: '' },
            'SH': { outcome: 'out', reason: '' }
        };
        const suggestion = suggestions[result];
        if (!suggestion) return;
        record.outcome = suggestion.outcome;
        record.reason = suggestion.reason;
        if (record.reason !== 'error') record.errorFielder = '';
        detailDraft.runners.batter = record;
    }

    function setDetailResult(result) {
        if (!detailDraft) return;
        detailDraft.result = result;
        const option = detailResultOptions.find(item => item.value === result);
        if (!option?.rbi) detailDraft.rbi = 0;
        applySuggestedBatterRecord(result);
        renderDetailEditor();
    }

    function setDetailRbi(value) {
        if (!detailDraft) return;
        detailDraft.rbi = Math.min(4, Math.max(0, Number.parseInt(value, 10) || 0));
        renderDetailPreview();
    }

    function setContactType(type) {
        if (!detailDraft) return;
        detailDraft.contactType = type;
        renderDetailEditor();
    }

    function getLandingZone(x, y) {
        if (y < 39) {
            if (x < 36) return '左外野';
            if (x > 64) return '右外野';
            return '中外野';
        }
        if (y < 67) {
            if (x < 35) return '三垒侧';
            if (x > 65) return '一垒侧';
            return x < 50 ? '游击区' : '二垒区';
        }
        if (x < 42) return '三垒线附近';
        if (x > 58) return '一垒线附近';
        return '投手前方';
    }

    function setLandingPoint(event) {
        if (!detailDraft || event.target.closest('.field-label')) return;
        const rect = event.currentTarget.getBoundingClientRect();
        const x = Math.min(100, Math.max(0, ((event.clientX - rect.left) / rect.width) * 100));
        const y = Math.min(100, Math.max(0, ((event.clientY - rect.top) / rect.height) * 100));
        detailDraft.landing = { x: Number(x.toFixed(1)), y: Number(y.toFixed(1)) };
        detailDraft.landingZone = getLandingZone(x, y);
        renderDetailEditor();
    }

    function addThrow(playerIndex) {
        if (!detailDraft || playerIndex < 0) return;
        detailDraft.throws.push(playerIndex);
        renderDetailEditor();
    }

    function undoThrow() {
        if (!detailDraft) return;
        detailDraft.throws.pop();
        renderDetailEditor();
    }

    function clearThrows() {
        if (!detailDraft) return;
        detailDraft.throws = [];
        renderDetailEditor();
    }

    function updateDetailField(field, value) {
        if (!detailDraft || !(field in detailDraft)) return;
        detailDraft[field] = value;
        renderDetailPreview();
    }

    function getRunnerCards() {
        if (!detailTarget || !detailDraft) return [];
        const { teamIndex, playerIndex, inningIndex } = detailTarget;
        const team = teams[teamIndex];
        const baseState = teams[teamIndex].baseData?.[playerIndex]?.[inningIndex]?.[0] || createBaseState();
        const batter = team.lineup[playerIndex];
        const cards = [{
            key: 'batter',
            sourceBase: 'batter',
            label: `打者 · #${batter.id} ${batter.name}`,
            runner: { playerIndex, lineupId: batter.id, name: batter.name }
        }];
        [
            { key: 'first', label: '一垒跑者' },
            { key: 'second', label: '二垒跑者' },
            { key: 'third', label: '三垒跑者' }
        ].forEach(runner => {
            if (baseState[runner.key] || detailDraft.runners[runner.key]) cards.push(runner);
            if (!baseState[runner.key] && !detailDraft.runners[runner.key]) return;
            const savedRecord = normalizeRunnerRecord(detailDraft.runners[runner.key]);
            const baseRunner = normalizeRunnerRef(baseState.runners?.[runner.key]);
            const player = Number.isInteger(baseRunner?.playerIndex) ? team.lineup[baseRunner.playerIndex] : null;
            const runnerRef = baseRunner || (savedRecord.name ? {
                playerIndex: savedRecord.playerIndex,
                lineupId: savedRecord.lineupId,
                name: savedRecord.name
            } : null);
            const displayName = player?.name || runnerRef?.name || runner.label;
            const displayId = player?.id || runnerRef?.lineupId;
            cards[cards.length - 1] = {
                key: runner.key,
                sourceBase: runner.key,
                label: `${runner.label} · ${displayId ? `#${displayId} ` : ''}${displayName}`,
                runner: runnerRef || { playerIndex: null, lineupId: null, name: displayName }
            };
        });
        return cards;
    }

    function renderRunnerOutcomes() {
        const container = document.getElementById('runner-outcomes');
        const cards = getRunnerCards();
        const fielders = getFielders(detailTarget.teamIndex);
        container.innerHTML = cards.map(card => `
            <div class="runner-card">
                <strong>${escapeHtml(card.label)}</strong>
                <div class="runner-meta">起点：${baseLabels[card.sourceBase] || card.sourceBase}</div>
                <div class="runner-actions">
                    ${runnerOutcomeOptions
                        .filter(option => card.key !== 'batter' || option.value !== 'stay')
                        .map(option => `
                        <button type="button" class="choice-btn ${normalizeRunnerRecord(detailDraft.runners[card.key]).outcome === option.value ? 'selected' : ''}"
                            onclick="setRunnerOutcome('${card.key}', '${option.value}')">${option.label}</button>
                    `).join('')}
                </div>
                ${(() => {
                    const record = normalizeRunnerRecord(detailDraft.runners[card.key]);
                    const needsReason = record.outcome && !['stay', 'out'].includes(record.outcome);
                    if (!needsReason) return '';
                    return `
                        <div class="runner-reason-row">
                            <span>进垒原因</span>
                            <select class="detail-select" onchange="setRunnerReason('${card.key}', this.value)">
                                ${runnerReasonOptions.map(option => `<option value="${option.value}" ${record.reason === option.value ? 'selected' : ''}>${option.label}</option>`).join('')}
                            </select>
                            ${record.reason === 'error' ? `
                                <span>传球失误</span>
                                <select class="detail-select" onchange="setRunnerErrorFielder('${card.key}', this.value)">
                                    <option value="">请选择守备员</option>
                                    ${fielders.filter(fielder => fielder.playerIndex >= 0).map(fielder => `<option value="${fielder.playerIndex}" ${record.errorFielder === String(fielder.playerIndex) ? 'selected' : ''}>${escapeHtml(getFielderLabel(detailTarget.teamIndex, fielder.playerIndex))}</option>`).join('')}
                                </select>
                            ` : ''}
                        </div>
                    `;
                })()}
            </div>
        `).join('');
    }

    function setRunnerOutcome(runner, outcome) {
        if (!detailDraft) return;
        const record = normalizeRunnerRecord(detailDraft.runners[runner]);
        record.outcome = outcome;
        if (['stay', 'out'].includes(outcome)) {
            record.reason = '';
            record.errorFielder = '';
        }
        detailDraft.runners[runner] = record;
        renderRunnerOutcomes();
        renderDetailPreview();
    }

    function setRunnerReason(runner, reason) {
        if (!detailDraft) return;
        const record = normalizeRunnerRecord(detailDraft.runners[runner]);
        record.reason = reason;
        if (reason !== 'error') record.errorFielder = '';
        detailDraft.runners[runner] = record;
        renderRunnerOutcomes();
        renderDetailPreview();
    }

    function setRunnerErrorFielder(runner, playerIndex) {
        if (!detailDraft) return;
        const record = normalizeRunnerRecord(detailDraft.runners[runner]);
        record.errorFielder = String(playerIndex ?? '');
        detailDraft.runners[runner] = record;
        renderRunnerOutcomes();
        renderDetailPreview();
    }

    function clampInput(id, maximum = null) {
        const input = document.getElementById(id);
        const number = Math.max(0, Number(input.value) || 0);
        const value = maximum === null ? number : Math.min(maximum, number);
        input.value = value;
        return value;
    }

    function updateCountDetail() {
        if (!detailDraft) return;
        detailDraft.balls = clampInput('detail-balls', 3);
        detailDraft.strikes = clampInput('detail-strikes', 2);
        detailDraft.outs = clampInput('detail-outs', 2);
        detailDraft.pitches = clampInput('detail-pitches');
        const minutes = document.getElementById('detail-minutes').value;
        detailDraft.minutesRemaining = minutes === '' ? '' : clampInput('detail-minutes');
        renderDetailPreview();
    }

    function formatRunnerSummary(detail, teamIndex = null) {
        return Object.entries(detail.runners)
            .map(([runner, rawRecord]) => [runner, normalizeRunnerRecord(rawRecord)])
            .filter(([, record]) => runnerOutcomeLabels[record.outcome])
            .map(([runner, record]) => {
                const runnerName = record.name || ({ batter: '打者', first: '一垒跑者', second: '二垒跑者', third: '三垒跑者' }[runner] || runner);
                const start = baseLabels[record.sourceBase || runner] || record.sourceBase || runner;
                const destination = record.outcome === 'stay'
                    ? start
                    : (baseLabels[record.outcome] || runnerOutcomeLabels[record.outcome]);
                const route = record.outcome === 'out' ? '出局' : `${start}→${destination}`;
                let reason = record.reason ? (runnerReasonLabels[record.reason] || '') : '';
                if (record.reason === 'error' && record.errorFielder !== '' && teamIndex !== null) {
                    reason += `（${getFielderLabel(teamIndex, Number(record.errorFielder))}传球失误）`;
                }
                return `${runnerName} ${route}${reason ? `，${reason}` : ''}`;
            })
            .join('；');
    }

    function buildDetailSummary(detail, teamIndex) {
        const segments = [];
        if (detail.result) {
            const resultOption = detailResultOptions.find(option => option.value === detail.result);
            segments.push(`结果：${resultOption?.label || detail.result}${resultOption?.rbi ? `，RBI ${detail.rbi || 0}` : ''}`);
        }
        if (detail.contactType) segments.push(detail.contactType);
        if (detail.landingZone) segments.push(`落点：${detail.landingZone}`);
        if (detail.throws.length) {
            segments.push(`传球：${detail.throws.map(index => getFielderLabel(teamIndex, index)).join(' → ')}`);
        }
        if (detail.errorFielder !== '') {
            segments.push(`失误：${getFielderLabel(teamIndex, Number(detail.errorFielder))}`);
        }
        const runners = formatRunnerSummary(detail, teamIndex);
        if (runners) segments.push(runners);
        segments.push(`球数 ${detail.balls}-${detail.strikes}，${detail.outs} 出局，本打席 ${detail.pitches} 球`);
        if (detail.minutesRemaining !== '') segments.push(`剩余 ${detail.minutesRemaining} 分钟`);
        if (detail.note) segments.push(detail.note);
        return segments.join('；');
    }

    function renderDetailPreview() {
        if (!detailDraft || !detailTarget) return;
        document.getElementById('detail-preview').textContent = buildDetailSummary(detailDraft, detailTarget.teamIndex);
    }

    function getNextPlateAppearance(teamIndex, playerIndex, inningIndex) {
        const team = teams[teamIndex];
        const next = getLineupEntries(team, true).find(entry => entry.player.id > team.lineup[playerIndex].id);
        if (next) {
            return { teamIndex, playerIndex: next.playerIndex, inningIndex: Math.max(inningIndex, next.player.entryInning || 0) };
        }
        const first = getLineupEntries(team, true)[0];
        if (first && inningIndex < inningCount - 1) {
            return { teamIndex, playerIndex: first.playerIndex, inningIndex: Math.max(inningIndex + 1, first.player.entryInning || 0) };
        }
        return null;
    }

    function enrichRunnerRecords(cards) {
        cards.forEach(card => {
            const record = normalizeRunnerRecord(detailDraft.runners[card.key]);
            record.name = card.runner?.name || record.name;
            record.playerIndex = card.runner?.playerIndex ?? record.playerIndex;
            record.lineupId = card.runner?.lineupId ?? record.lineupId;
            record.sourceBase = card.sourceBase;
            detailDraft.runners[card.key] = record;
        });
    }

    function applyRunnerStateToNextCell(teamIndex, playerIndex, inningIndex, cards) {
        const nextTarget = getNextPlateAppearance(teamIndex, playerIndex, inningIndex);
        if (!nextTarget) return;

        const nextState = createBaseState();
        cards.forEach(card => {
            const record = normalizeRunnerRecord(detailDraft.runners[card.key]);
            let destination = record.outcome;
            if (!destination && card.key !== 'batter') destination = card.sourceBase;
            if (destination === 'stay') destination = card.sourceBase;
            if (!['first', 'second', 'third'].includes(destination)) return;

            nextState[destination] = true;
            nextState.runners[destination] = normalizeRunnerRef(card.runner);
        });

        const team = teams[nextTarget.teamIndex];
        if (!team.baseData[nextTarget.playerIndex][nextTarget.inningIndex]) {
            team.baseData[nextTarget.playerIndex][nextTarget.inningIndex] = [createBaseState()];
        }
        team.baseData[nextTarget.playerIndex][nextTarget.inningIndex][0] = nextState;
    }

    function savePlayDetail() {
        if (!detailDraft || !detailTarget) return;
        updateCountDetail();
        const { teamIndex, playerIndex, inningIndex } = detailTarget;
        const runnerCards = getRunnerCards();
        enrichRunnerRecords(runnerCards);
        if (detailDraft.result) {
            const resultOption = detailResultOptions.find(option => option.value === detailDraft.result);
            teams[teamIndex].gridData[playerIndex][inningIndex][0] = resultOption?.rbi
                ? `${detailDraft.result}-${detailDraft.rbi || 0}`
                : detailDraft.result;
        }
        applyRunnerStateToNextCell(teamIndex, playerIndex, inningIndex, runnerCards);
        detailDraft.updatedAt = new Date().toISOString();
        teams[teamIndex].playDetails[playerIndex][inningIndex] = normalizePlayDetail(detailDraft);
        closePlayDetail();
        renderAll();
        saveToLocalStorage();
    }

    function addPlayer(teamIndex) {
        const team = teams[teamIndex];
        const nameInput = document.getElementById(`new-player-name-${teamIndex}`);
        const posInput = document.getElementById(`new-player-pos-${teamIndex}`);
        const slotInput = document.getElementById(`new-player-slot-${teamIndex}`);
        const customName = nameInput.value.trim();
        const customPos = posInput.value.trim();

        if (!customName) {
            alert('请先填写新成员姓名。');
            nameInput.focus();
            return;
        }
        if (customPos && !canUsePosition(canonicalPosition(customPos))) return;

        const slotValue = slotInput?.value || 'append';
        const entryInning = Math.min(inningCount - 1, Math.max(0, Number(document.getElementById(`new-player-inning-${teamIndex}`)?.value) || 0));
        const addPlayerRows = player => {
            team.lineup.push(player);
            team.gridData.push(Array.from({ length: inningCount }, () => ['']));
            team.baseData.push(Array.from({ length: inningCount }, () => [createBaseState()]));
            team.playDetails.push(Array.from({ length: inningCount }, () => null));
            const playerIndex = team.lineup.length - 1;
            if (customPos) updateAlignmentPosition(teamIndex, playerIndex, customPos);
            return playerIndex;
        };

        if (slotValue === 'append') {
            const playerIndex = addPlayerRows({
                id: Math.max(0, ...team.lineup.map(player => player.id)) + 1,
                name: customName,
                pos: '',
                active: true,
                added: true,
                battingOnly: isBattingOnlyPosition(canonicalPosition(customPos)),
                entryInning
            });
            selectedCell = { teamIndex, playerIndex, inningIndex: entryInning, slotIndex: 0 };
        } else if (slotValue.startsWith('insert:')) {
            const targetIndex = Number(slotValue.slice('insert:'.length));
            const target = team.lineup[targetIndex];
            if (!target || target.active === false || target.removed) return;
            if (!confirm(`确认将 ${customName} 插入第 ${target.id} 棒前？原第 ${target.id} 棒及后续棒次将顺延。`)) return;
            const insertOrder = target.id;
            team.lineup.forEach(player => {
                if (player.isStarter === undefined && !player.added && !Number.isInteger(player.replacesIndex)
                    && player.id <= gameConfig.playerCount) player.isStarter = true;
                if (player.id >= insertOrder) player.id += 1;
            });
            const playerIndex = addPlayerRows({
                id: insertOrder,
                name: customName,
                pos: '',
                active: true,
                added: true,
                battingOnly: isBattingOnlyPosition(canonicalPosition(customPos)),
                entryInning
            });
            selectedCell = { teamIndex, playerIndex, inningIndex: entryInning, slotIndex: 0 };
        } else {
            const playerIndex = Number(slotValue.startsWith('replace:') ? slotValue.slice('replace:'.length) : slotValue);
            const oldPlayer = team.lineup[playerIndex];
            if (!oldPlayer || oldPlayer.active === false) return;
            if (customPos && isBattingOnlyPosition(canonicalPosition(customPos))) {
                alert('DH/EH 是额外打击员，不能替换守备球员；请选择追加或插入棒次。');
                return;
            }
            if (!confirm(`确认从第 ${entryInning + 1} 局起，由 ${customName} 替换第 ${oldPlayer.id} 棒 ${oldPlayer.name}？原球员记录将完整保留，新球员另起一行。`)) return;
            const newIndex = team.lineup.length;
            const positionsBefore = team.lineup.map(player => player.pos || '');
            oldPlayer.active = false;
            const replacement = {
                id: oldPlayer.id,
                name: customName,
                pos: oldPlayer.pos || '',
                active: true,
                replacesIndex: playerIndex,
                entryInning
            };
            team.lineup.push(replacement);
            team.gridData.push(Array.from({ length: inningCount }, () => ['']));
            team.baseData.push(Array.from({ length: inningCount }, () => [createBaseState()]));
            team.playDetails.push(Array.from({ length: inningCount }, () => null));
            // Carry the pending pre-at-bat situation without changing the original row.
            if (!team.gridData[playerIndex][entryInning][0] && !team.playDetails[playerIndex][entryInning]) {
                team.baseData[newIndex][entryInning] = JSON.parse(JSON.stringify(team.baseData[playerIndex][entryInning]));
            }
            selectedCell = { teamIndex, playerIndex: newIndex, inningIndex: entryInning, slotIndex: 0 };
            if (customPos) updateAlignmentPosition(teamIndex, newIndex, customPos);
            replacement.undoSubstitution = {
                positionsBefore,
                baseDataBefore: JSON.parse(JSON.stringify(team.baseData[newIndex]))
            };
        }
        syncLineupIds(teamIndex);
        team.defensiveAlignment = createAlignment(team.lineup);
        nameInput.value = '';
        posInput.value = '';
        renderAll();
        updateKeypadTitle();
        scheduleSave();
    }

    function undoSubstitution(teamIndex, playerIndex) {
        const team = teams[teamIndex];
        const replacement = team?.lineup[playerIndex];
        if (!replacement || !Number.isInteger(replacement.replacesIndex) || replacement.active === false || replacement.removed) return;
        const original = team.lineup[replacement.replacesIndex];
        if (!original) return;

        const hasRecordedAtBat = team.gridData[playerIndex].some(cell => cell.some(Boolean))
            || team.playDetails[playerIndex].some(Boolean)
            || (replacement.undoSubstitution?.baseDataBefore
                && JSON.stringify(team.baseData[playerIndex]) !== JSON.stringify(replacement.undoSubstitution.baseDataBefore));
        if (hasRecordedAtBat) {
            alert('新上场球员已有比赛记录，无法撤销换人；请先处理该球员的打席、垒包和详细记录。');
            return;
        }
        if (!confirm(`撤销 ${replacement.name} 替换 ${original.name}？`)) return;

        original.active = true;
        original.removed = false;
        replacement.active = false;
        replacement.removed = true;
        const positionsBefore = replacement.undoSubstitution?.positionsBefore;
        if (Array.isArray(positionsBefore)) {
            team.lineup.forEach((player, index) => {
                if (positionsBefore[index] !== undefined) player.pos = canonicalPosition(positionsBefore[index]);
            });
        } else {
            const previousPosition = original.pos;
            const occupyingPlayer = team.lineup.find((player, index) => index !== playerIndex
                && player.active !== false && !player.removed && canonicalPosition(player.pos) === canonicalPosition(previousPosition));
            if (occupyingPlayer) occupyingPlayer.pos = replacement.pos;
            original.pos = previousPosition;
        }
        team.defensiveAlignment = createAlignment(team.lineup);
        if (selectedCell.teamIndex === teamIndex && selectedCell.playerIndex === playerIndex) {
            selectedCell.playerIndex = replacement.replacesIndex;
        }
        renderAll();
        updateKeypadTitle();
        scheduleSave();
    }

    function removePlayer(teamIndex, playerIndex) {
        const team = teams[teamIndex];
        const player = team.lineup[playerIndex];
        if (!player || player.isStarter === true || (!player.added && player.id <= gameConfig.playerCount)
            || team.lineup.some(item => item.replacesIndex === playerIndex)) return;
        if (team.gridData[playerIndex].some(cell => cell.some(Boolean)) || team.playDetails[playerIndex].some(Boolean)) {
            alert('该球员已有比赛记录，请使用换人功能保留记录。');
            return;
        }
        player.active = false;
        player.removed = true;
        syncLineupIds(teamIndex);
        team.defensiveAlignment = createAlignment(team.lineup);

        if (selectedCell.teamIndex === teamIndex) {
            if (selectedCell.playerIndex === playerIndex) selectedCell.playerIndex = getLineupEntries(team, true)[0].playerIndex;
        }

        renderAll();
        updateKeypadTitle();
        scheduleSave();
    }

    function selectCell(teamIndex, pIdx, iIdx, slotIdx = 0, updateUi = true) {
        selectedCell = { teamIndex, playerIndex: pIdx, inningIndex: iIdx, slotIndex: slotIdx };
        if (updateUi) {
            renderAll();
            updateKeypadTitle();
        }
    }

    function updateKeypadTitle() {
        const titleEl = document.getElementById('keypad-title');
        if (!titleEl) return;

        const team = teams[selectedCell.teamIndex];
        const player = team.lineup[selectedCell.playerIndex];
        titleEl.textContent = `当前录入：${team.name} - [第 ${selectedCell.inningIndex + 1} 局] - ${player.name}`;
    }

    function advanceSelectedCell() {
        const next = getNextPlateAppearance(selectedCell.teamIndex, selectedCell.playerIndex, selectedCell.inningIndex);
        if (next) selectedCell = { ...next, slotIndex: 0 };
    }

    function inputResult(result) {
        const { teamIndex, playerIndex, inningIndex, slotIndex } = selectedCell;
        const cell = teams[teamIndex].gridData[playerIndex][inningIndex];
        cell[slotIndex] = result;
        advanceSelectedCell();
        renderAll();
        updateKeypadTitle();
        scheduleSave();
    }

    function calculateStats(team, playerIndex) {
        const rowData = team.gridData[playerIndex];
        let pa = 0, ab = 0, h = 0, hr = 0, rbi = 0, bb = 0, so = 0, dp = 0, sf = 0, sh = 0, roe = 0, totalBases = 0;
        const hitTypes = ['1B', '2B', '3B', 'HR'];

        rowData.forEach(cellSlots => {
            (cellSlots || []).forEach(cell => {
                if (cell !== '') {
                    const [result, rbiText = '0'] = cell.split('-');
                    const rbiValue = Number.parseInt(rbiText, 10);
                    pa++;
                    rbi += Number.isNaN(rbiValue) ? 0 : rbiValue;

                    if (hitTypes.includes(result)) h++;
                    if (result === '1B') totalBases += 1;
                    if (result === '2B') totalBases += 2;
                    if (result === '3B') totalBases += 3;
                    if (result === 'HR') {
                        hr++;
                        totalBases += 4;
                    }
                    if (result === 'BB') bb++;
                    if (result === 'SO') so++;
                    if (result === 'DP') dp++;
                    if (result === 'SF') sf++;
                    if (result === 'SH') sh++;
                    if (result === 'ROE') roe++;
                }
            });
        });

        ab = pa - bb - sf - sh;
        const avg = ab > 0 ? (h / ab).toFixed(3) : '.000';
        const obp = (ab + bb + sf) > 0 ? ((h + bb) / (ab + bb + sf)).toFixed(3) : '.000';
        const slg = ab > 0 ? (totalBases / ab).toFixed(3) : '.000';
        const ops = (Number(obp) + Number(slg)).toFixed(3);
        const formatRatio = (val) => val.startsWith('0.') ? val.substring(1) : val;

        return { pa, ab, h, hr, rbi, bb, so, dp, sf, sh, roe, avg: formatRatio(avg), obp: formatRatio(obp), ops: formatRatio(ops) };
    }

    function getPlayLogRows() {
        const rows = [];
        teams.forEach((team, teamIndex) => {
            team.playDetails.forEach((playerDetails, playerIndex) => {
                playerDetails.forEach((detail, inningIndex) => {
                    if (!detail) return;
                    rows.push({
                        teamIndex,
                        playerIndex,
                        inningIndex,
                        team: team.name,
                        batter: team.lineup[playerIndex]?.name || `球员 ${playerIndex + 1}`,
                        result: team.gridData?.[playerIndex]?.[inningIndex]?.[0] || '',
                        detail
                    });
                });
            });
        });
        return rows.sort(comparePlayRows);
    }

    function getProgressRows() {
        const rows = [];
        teams.forEach((team, teamIndex) => {
            team.lineup.forEach((player, playerIndex) => {
                Array.from({ length: inningCount }, (_, inningIndex) => {
                    const result = team.gridData?.[playerIndex]?.[inningIndex]?.[0] || '';
                    const savedDetail = team.playDetails?.[playerIndex]?.[inningIndex];
                    if (!result && !savedDetail) return;

                    rows.push({
                        teamIndex,
                        playerIndex,
                        inningIndex,
                        team: team.name,
                        batter: player?.name || `球员 ${playerIndex + 1}`,
                        result,
                        detail: normalizePlayDetail(savedDetail) || createPlayDetail()
                    });
                });
            });
        });
        return rows.sort(comparePlayRows);
    }

    function getResultDisplay(result) {
        const [baseResult = '', rbiText = '0'] = String(result || '').split('-');
        const option = baseResult
            ? resultOptions.find(item => item.value === baseResult)
            : null;
        const label = option?.label?.replace(/\s*\([^)]*\)\s*$/, '') || baseResult || '未记录结果';
        const rbi = Number.parseInt(rbiText, 10) || 0;
        return { label, rbi };
    }

    function getRunnerProgressText(record, teamIndex) {
        const start = baseLabels[record.sourceBase] || record.sourceBase || '垒上';
        const destination = record.outcome === 'stay'
            ? start
            : (baseLabels[record.outcome] || runnerOutcomeLabels[record.outcome] || record.outcome);
        const route = record.outcome === 'out' ? '出局' : `${start}→${destination}`;
        let reason = record.reason
            ? (runnerReasonLabels[record.reason] || '')
            : (record.outcome === 'out' ? '' : '推进');
        if (record.reason === 'error' && record.errorFielder !== '') {
            reason += `（${getFielderLabel(teamIndex, Number(record.errorFielder))}传球失误）`;
        }
        return `${reason ? `${reason} ` : ''}${route}`;
    }

    function getProgressGroups(rows = getProgressRows()) {
        const groups = [];
        rows.forEach(row => {
            const key = `${row.inningIndex}-${row.teamIndex}`;
            let group = groups.find(item => item.key === key);
            if (!group) {
                group = {
                    key,
                    inningIndex: row.inningIndex,
                    teamIndex: row.teamIndex,
                    title: `第 ${row.inningIndex + 1} 局${row.teamIndex === 0 ? '上' : '下'}`,
                    team: row.team,
                    events: []
                };
                groups.push(group);
            }

            const batter = teams[row.teamIndex].lineup[row.playerIndex];
            const result = getResultDisplay(row.result);
            const batterRecord = normalizeRunnerRecord(row.detail.runners?.batter);
            const batterScore = batterRecord.outcome === 'score' ? 1 : 0;
            group.events.push({
                player: `${batter ? getOrderLabel(batter) : row.playerIndex + 1}棒 · ${row.batter}`,
                text: result.label,
                score: batterScore,
                detail: row.detail.contactType || ''
            });

            Object.entries(row.detail.runners || {}).forEach(([keyName, rawRecord]) => {
                if (keyName === 'batter') return;
                const record = normalizeRunnerRecord(rawRecord);
                if (!record.outcome) return;
                const playerName = `${record.lineupId ? `#${record.lineupId} ` : ''}${record.name || `${baseLabels[keyName] || keyName}跑者`}`;
                group.events.push({
                    player: playerName,
                    text: getRunnerProgressText(record, row.teamIndex),
                    score: record.outcome === 'score' ? 1 : 0,
                    detail: ''
                });
            });
        });
        return groups;
    }

    function renderGameProgress(rows) {
        const groups = getProgressGroups(rows);
        if (!groups.length) return '';
        return `
            <div class="panel game-progress">
                <p class="panel-title">比赛进程</p>
                ${groups.map(group => `
                    <section class="progress-inning">
                        <h3 class="progress-inning-title">${escapeHtml(group.title)} · ${escapeHtml(group.team)}</h3>
                        <div class="progress-events">
                            ${group.events.map(event => `
                                <div class="progress-event">
                                    <strong>${escapeHtml(event.player)}</strong>
                                    ${escapeHtml(event.text)}
                                    ${event.detail ? `<span class="progress-reason"> · ${escapeHtml(event.detail)}</span>` : ''}
                                    ${event.score ? `<span class="progress-score">+${event.score}分</span>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </section>
                `).join('')}
            </div>
        `;
    }

    function renderPlayLog() {
        const container = document.getElementById('play-log-container');
        const rows = getPlayLogRows();
        container.innerHTML = `
            ${renderGameProgress()}
            <div class="panel">
                <p class="panel-title">逐球详细记录</p>
                ${rows.length ? `
                    <div class="table-responsive">
                        <table class="play-log">
                            <thead>
                                <tr>
                                    <th>局数</th><th>进攻方</th><th>打者</th><th>结果</th>
                                    <th>球型 / 落点</th><th>传球与跑者</th><th>球数 / 时间</th><th>操作</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${rows.map(row => {
                                    const throwText = row.detail.throws.length
                                        ? row.detail.throws.map(index => getFielderLabel(row.teamIndex, index)).join(' → ')
                                        : '—';
                                    const runnerText = formatRunnerSummary(row.detail, row.teamIndex) || '—';
                                    return `
                                        <tr>
                                            <td>第 ${row.inningIndex + 1} 局</td>
                                            <td>${escapeHtml(row.team)}</td>
                                            <td><strong>${escapeHtml(row.batter)}</strong></td>
                                            <td>${escapeHtml(row.result || '—')}</td>
                                            <td>
                                                <div>${escapeHtml(row.detail.contactType || '—')}</div>
                                                <div class="play-summary">${escapeHtml(row.detail.landingZone || '未记录落点')}</div>
                                            </td>
                                            <td>
                                                <div class="play-summary">传球：${escapeHtml(throwText)}</div>
                                                <div class="play-summary">跑者：${escapeHtml(runnerText)}</div>
                                            </td>
                                            <td>
                                                <div>${row.detail.balls}-${row.detail.strikes}，${row.detail.outs} 出局</div>
                                                <div class="play-summary">${row.detail.pitches} 球${row.detail.minutesRemaining === '' ? '' : ` · 剩余 ${row.detail.minutesRemaining} 分`}</div>
                                            </td>
                                            <td><button type="button" class="btn btn-bb" style="padding:7px 10px;" onclick="openPlayDetail(${row.teamIndex}, ${row.playerIndex}, ${row.inningIndex})">补充这球</button></td>
                                        </tr>
                                    `;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                ` : '<div class="empty-log">尚无逐球详情。点击任一打席格，选择“详细记录本球”开始记录。</div>'}
            </div>
        `;
    }

    function renderStats() {
        const container = document.getElementById('stats-container');
        container.innerHTML = '';

        teams.forEach((team, teamIndex) => {
            const panel = document.createElement('div');
            panel.className = 'panel';
            panel.innerHTML = `
                <p class="panel-title">${team.name}个人打击数据实时统计表</p>
                <div class="table-responsive">
                    <table class="stats-table">
                        <thead>
                            <tr>
                                <th>棒次</th><th>姓名</th><th>PA</th><th>AB</th>
                                <th>H</th><th>HR</th><th>RBI</th><th>BB</th><th>SO</th><th>DP</th><th>SF</th><th>SH</th><th>ROE</th><th>AVG</th><th>OBP</th><th>OPS</th>
                            </tr>
                        </thead>
                        <tbody id="stats-body-${teamIndex}"></tbody>
                    </table>
                </div>
            `;
            container.appendChild(panel);

            const tbody = document.getElementById(`stats-body-${teamIndex}`);
            getLineupEntries(team).forEach(({ player, playerIndex: pIdx }) => {
                const stat = calculateStats(team, pIdx);
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${getOrderLabel(player)}</td>
                    <td><strong>${escapeHtml(player.name)}</strong>${player.active === false ? '<small style="display:block;color:#64748b;">已换下</small>' : ''}</td>
                    <td>${stat.pa}</td>
                    <td>${stat.ab}</td>
                    <td>${stat.h}</td>
                    <td>${stat.hr}</td>
                    <td>${stat.rbi}</td>
                    <td>${stat.bb}</td>
                    <td>${stat.so}</td>
                    <td>${stat.dp}</td>
                    <td>${stat.sf}</td>
                    <td>${stat.sh}</td>
                    <td>${stat.roe}</td>
                    <td style="color:#0f172a; font-weight:bold;">${stat.avg}</td>
                    <td style="color:#0f172a; font-weight:bold;">${stat.obp}</td>
                    <td style="color:#0f172a; font-weight:bold;">${stat.ops}</td>
                `;
                tbody.appendChild(tr);
            });
        });
    }

    init();
</script>
